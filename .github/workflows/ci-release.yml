name: CI & Release Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    name: Quality Gate (Format, Lint, Types, Deps, Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-machete
        uses: taiki-e/install-action@cargo-machete

      - name: Frontend install, typecheck, lint & build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run build

      - name: Rust check-format, check-lint, check-deps & check-test
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo machete
          cargo test --locked

  build:
    name: Build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
            bin_name: linguist.exe
            artifact_name: linguist-windows-x64.exe
            is_windows: true
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            arch: x64_arm64
            bin_name: linguist.exe
            artifact_name: linguist-windows-arm64.exe
            is_windows: true
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
            bin_name: linguist
            artifact_name: linguist-linux-x64
            is_windows: false
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            arch: arm64
            bin_name: linguist
            artifact_name: linguist-linux-arm64
            is_windows: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js & build embedded frontend
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup MSVC developer environment
        if: matrix.is_windows
        shell: pwsh
        run: |
          $arch = '${{ matrix.arch }}'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            $vsPath = & $vswhere -latest -products * -property installationPath
          }
          if (-not $vsPath) { throw "Visual Studio installation not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvarsall.bat not found at $vcvars" }

          $before = [hashtable]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($line in (cmd.exe /s /c "set")) {
            $idx = $line.IndexOf("=")
            if ($idx -gt 0) { $before[$line.Substring(0, $idx)] = $line.Substring($idx + 1) }
          }

          $envDump = cmd.exe /s /c "`"$vcvars`" $arch && echo __MSVC_ENV__&& set"
          if ($LASTEXITCODE -ne 0) {
            $envDump | Write-Host
            throw "vcvarsall.bat failed with exit code $LASTEXITCODE for arch '$arch'"
          }

          $inEnv = $false
          $envBlock = [System.Text.StringBuilder]::new()
          $newPaths = [System.Collections.Generic.List[string]]::new()
          foreach ($line in $envDump) {
            if (-not $inEnv) {
              if ($line.Trim() -eq "__MSVC_ENV__") { $inEnv = $true }
              continue
            }
            $idx = $line.IndexOf("=")
            if ($idx -le 0) { continue }
            $name = $line.Substring(0, $idx)
            $val = $line.Substring($idx + 1)
            if ($name -ieq "Path") {
              $oldSet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
              foreach ($p in (($before["Path"] ?? "") -split ";")) {
                if ($p.Trim()) { [void]$oldSet.Add($p.Trim().TrimEnd("\")) }
              }
              foreach ($p in ($val -split ";")) {
                $trimmed = $p.Trim()
                if ($trimmed -and -not $oldSet.Contains($trimmed.TrimEnd("\"))) {
                  $newPaths.Add($trimmed)
                }
              }
            } elseif (-not $before.ContainsKey($name) -or $before[$name] -cne $val) {
              [void]$envBlock.Append("$name<<__GH_MSVC_ENV__`n$val`n__GH_MSVC_ENV__`n")
            }
          }

          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          if ($envBlock.Length -gt 0) {
            [System.IO.File]::AppendAllText($env:GITHUB_ENV, $envBlock.ToString(), $utf8NoBom)
          }
          if ($newPaths.Count -gt 0) {
            $newPaths.Reverse()
            [System.IO.File]::AppendAllText($env:GITHUB_PATH, (($newPaths -join "`n") + "`n"), $utf8NoBom)
          }

      - name: Install Linux musl cross-compile dependencies
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Linux ARM64 cross-compile dependencies
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary (Windows)
        if: matrix.is_windows
        env:
          RUSTFLAGS: "-C link-arg=/OPT:REF,ICF"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (Linux x64 musl)
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (Linux arm64)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact & SHA256
        shell: bash
        run: |
          mkdir -p staging
          TARGET_DIR="target/${{ matrix.target }}/release"
          cp "${TARGET_DIR}/${{ matrix.bin_name }}" "staging/${{ matrix.artifact_name }}"
          if [ "${{ matrix.name }}" = "windows-x64" ]; then
            cp "${TARGET_DIR}/linguist.exe" "staging/linguist.exe"
          fi
          (cd staging && sha256sum * > "${{ matrix.name }}.sha256")

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: staging/${{ matrix.artifact_name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: staging/*
          if-no-files-found: error

  docker-build-test:
    name: Docker Build & Test (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            os: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: linguist:test-${{ matrix.arch }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Run container verification suite
        run: bash scripts/test-docker.sh "linguist:test-${{ matrix.arch }}"

      - name: Normalize lowercase GHCR repository name
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: meta
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push tested architecture candidate by digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=ghcr.io/${{ steps.meta.outputs.repo }},push-by-digest=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}

      - name: Save tested digest artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p digests
          printf '%s' "${{ steps.push.outputs.digest }}" > "digests/digest-${{ matrix.arch }}.txt"

      - name: Upload digest artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: digests/digest-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.gen_tag.outputs.release_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Generate Version Tag
        id: gen_tag
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
          RELEASE_TAG="v${CARGO_VERSION}-b${{ github.run_number }}-${SHORT_SHA}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Publish Release & Upload Templates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp linguist.d.ts dist/linguist.d.ts
          cp config.example.toml dist/config.example.toml
          cp config.docker.example.toml dist/config.docker.example.toml
          cp chatLanguageModels.example.json dist/chatLanguageModels.example.json
          cp projects.json dist/projects.example.json
          cp routes.json dist/routes.example.json

          cat << EOF > release_notes.md
          ### 下载说明
          - **Windows x64**：\`linguist-windows-x64.exe\`（或 \`linguist.exe\`）
          - **Windows ARM64**：\`linguist-windows-arm64.exe\`
          - **Linux x64（静态 musl）**：\`linguist-linux-x64\`
          - **Linux ARM64**：\`linguist-linux-arm64\`
          - **Docker 多架构镜像（amd64 / arm64）**：\`ghcr.io/preca-hoshino/linguist:${RELEASE_TAG}\`

          **变更摘要**：
          > ${COMMIT_MSG}

          **验证构建来源 (GitHub Attestations)**：
          \`\`\`bash
          gh attestation verify linguist-linux-x64 --repo ${{ github.repository }}
          \`\`\`
          EOF

          gh release create "${RELEASE_TAG}" \
            dist/* \
            --title "${RELEASE_TAG}" \
            --notes-file release_notes.md

      - name: Cleanup Older Releases (Keep Latest 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName --jq '.[5:][].tagName' | while read -r old_tag; do
            if [ -n "$old_tag" ]; then
              echo "Deleting old release and tag: $old_tag"
              gh release delete "$old_tag" --yes --cleanup-tag || true
            fi
          done

  docker-publish:
    name: Publish Multi-Arch Docker Image
    needs: [docker-build-test, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download tested architecture digests
        uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          merge-multiple: true
          path: digests

      - name: Normalize lowercase GHCR repository name
        id: meta
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-arch manifest and update latest
        id: manifest
        env:
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
          IMAGE: ghcr.io/${{ steps.meta.outputs.repo }}
        run: |
          AMD64_DIGEST="$(cat digests/digest-amd64.txt)"
          ARM64_DIGEST="$(cat digests/digest-arm64.txt)"

          docker buildx imagetools create -t "${IMAGE}:${RELEASE_TAG}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            "${IMAGE}@${ARM64_DIGEST}"

          INSPECT_OUT="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}")"
          echo "${INSPECT_OUT}"
          echo "${INSPECT_OUT}" | grep -q "${AMD64_DIGEST}"
          echo "${INSPECT_OUT}" | grep -q "${ARM64_DIGEST}"

          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${RELEASE_TAG}"

          MANIFEST_DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"

          {
            echo "### Published Multi-Arch Docker Image"
            echo "- Version tag: \`${IMAGE}:${RELEASE_TAG}\`"
            echo "- Latest tag: \`${IMAGE}:latest\`"
            echo "- Multi-arch digest: \`${MANIFEST_DIGEST}\`"
            echo "- \`linux/amd64\` digest: \`${AMD64_DIGEST}\`"
            echo "- \`linux/arm64\` digest: \`${ARM64_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate container provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.repo }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
