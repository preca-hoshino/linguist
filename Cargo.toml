[package]
name = "linguist"
version = "0.2.1"
edition = "2024"
description = "Programmable script-routed OpenAI Chat API gateway and token telemetry dashboard"
readme = "README.md"
license = "AGPL-3.0"
repository = "https://github.com/preca-hoshino/linguist"
keywords = ["openai", "gateway", "proxy", "telemetry", "llm"]
categories = ["web-programming::http-server", "command-line-utilities"]

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
boa_engine = "0.20"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
mime_guess = "2.0"
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots", "acl", "script"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots", "stream", "json"] }
ring = "0.17"
rust_decimal = { version = "1.39", features = ["serde-with-str"] }
rust-embed = { version = "8.7", features = ["include-exclude", "compression"] }
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "json", "macros", "migrate", "rust_decimal"] }
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tokio = { version = "1.45", features = ["full"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.16", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unused = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
missing_docs_in_private_items = "deny"
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
