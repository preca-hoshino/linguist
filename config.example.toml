[server]
host = "127.0.0.1"
port = 9527
# 上游连接和读取空闲超时；非流式请求同时受总时限约束
upstream_timeout_secs = 600
# 收到 SIGTERM/SIGINT 后等待流式连接与日志落盘的优雅退出秒数
graceful_shutdown_secs = 60

[database]
# PostgreSQL 存储配置目录、日志与统计；启动时自动迁移
url = "postgres://linguist:password@127.0.0.1:5432/linguist"
max_connections = 10
log_error_payload = true
log_full_payload = false

[script_engine]
timeout_ms = 50
memory_limit_mb = 32
net_timeout_ms = 2000
billing_net_timeout_ms = 5000
max_http_calls_per_stage = 3
max_http_calls_billing = 3
allow_private_network = false
allowed_hosts = []
fallback_status_codes = [429, 500, 502, 503, 504]

[metrics]
# 实时测速滑动窗口（反哺 ③ 路由脚本 candidates[].metrics）
sliding_window_minutes = 60
warmup_days_from_db = 7

[ui]
title = "Linguist Gateway & Telemetry"
timezone = "Asia/Shanghai"
default_days_range = 30
leaderboard_min_requests = 1

[billing]
# 可选：按最新参考汇率显示折算值；省略时只显示原币
# display_currency = "CNY"

[oidc]
# 示例值：必须以身份提供商发现文档中的 issuer 为准
issuer = "https://pass.restart.org.cn/oidc"

# 身份提供商中创建的服务端 Web 应用的 Client ID
client_id = "your-client-id"

# Linguist 的外部访问地址，需与身份提供商登记的回调地址完全一致
redirect_uri = "https://linguist.example.com/auth/callback"

# 只包含 client secret 的文件路径
client_secret_file = "./secrets/oidc-client-secret"
